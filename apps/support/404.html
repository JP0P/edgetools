<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#141715" />
    <title>Page not found — EdgeTools Support</title>
    <link rel="icon" href="./assets/edge-icon.png" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/support.css" />
    <script type="module" src="./assets/site.js"></script>
    <script type="module" src="./assets/intercom.js"></script>
  </head>
  <body class="surface surface-support">
    <header class="site-header support-header">
      <div class="header-inner page-width">
        <a class="brand-link" href="https://support.edgetools.app/" data-preview-href="/support/" aria-label="EdgeTools Support">
          <img src="./assets/edge-logo.svg" alt="Edge" width="92" height="27" />
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-product">Tools / Support</span>
        </a>
        {{nav.header}}
      </div>
      {{nav.official}}
    </header>
    <main class="not-found page-width">
      <div>
        <h1>404</h1>
        <h2>Page not found.</h2>
        <p>Check the address or return to Support tools.</p>
        <div class="hero-actions">
          <a
            class="button button-primary"
            href="https://support.edgetools.app/"
            data-preview-href="/support/"
          >Back to Support tools</a>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="footer-inner page-width">
        <span>© <span data-current-year>2026</span> Edge Wallet</span>
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="https://edge.app/">Edge Wallet</a>
          <a href="https://support.edge.app/">Help Center</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
