<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base href="/" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#11141b" />
    <title>Page not found — Staff Hub</title>
    <link rel="icon" href="./assets/edge-icon.png" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="stylesheet" href="./assets/staff.css" />
    <script type="module" src="./assets/site.js"></script>
  </head>
  <body class="surface surface-staff">
    <header class="site-header staff-header">
      <div class="header-inner page-width">
        <a class="brand-link" href="https://staff.edgetools.app/" data-preview-href="/staff/" aria-label="EdgeTools Staff">
          <img src="./assets/edge-logo.svg" alt="Edge" width="92" height="27" />
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-product">Tools / Staff</span>
        </a>
        {{nav.header}}
      </div>
      {{nav.official}}
    </header>
    <main class="not-found page-width">
      <div>
        <h1>404</h1>
        <h2>Page not found.</h2>
        <p>Check the address or return to Staff home.</p>
        <div class="hero-actions">
          <a class="button button-primary" href="https://staff.edgetools.app/" data-preview-href="/staff/">
            Back to Staff home
          </a>
          <a class="button button-quiet" href="https://support.edgetools.app/staff/" data-preview-href="/support/staff/">
            Support staff
          </a>
        </div>
      </div>
    </main>
    <footer class="site-footer staff-footer">
      <div class="footer-inner page-width">
        <span>© <span data-current-year>2026</span> Edge Wallet</span>
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="https://edge.app/">Edge Wallet</a>
          <a href="https://support.edge.app/">Help Center</a>
          <a href="https://edgetools.app/" data-preview-href="/">Public tools</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
