# DigitalOcean App Platform spec for the public catalog and lean Support
# handoff. Four public tools are paths inside dist/main. Protected Staff assets
# and the exact public status/token API routes are deployed through Cloudflare
# Worker builds; the API routes share the existing Support Staff Worker.

name: edgetools-public
region: nyc

domains:
  - domain: edgetools.app
    type: PRIMARY
  - domain: support.edgetools.app
    type: ALIAS

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

static_sites:
  - name: main-public
    environment_slug: node-js
    github:
      repo: JP0P/edgetools
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    output_dir: dist/main
    index_document: index.html
    error_document: 404.html

  - name: support-public
    environment_slug: node-js
    github:
      repo: JP0P/edgetools
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    output_dir: dist/support
    index_document: index.html
    error_document: 404.html

ingress:
  rules:
    - match:
        authority:
          exact: edgetools.app
        path:
          prefix: /
      component:
        name: main-public
    - match:
        authority:
          exact: support.edgetools.app
        path:
          prefix: /
      component:
        name: support-public
